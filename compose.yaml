# Keston Admin: the web app and its own API (/api), in one container. It runs
# alongside Keston ID (the id repo's compose), on its "keston" network. Keston
# ID's Caddy serves http://admin.keston.localhost (https://admin.keston.co
# live) from it.
#
# The API is only for the Keston Admin web app: it passes its requests on to
# Keston ID (and, later, Keston's other apps), and splits requests that touch
# several of them. Signing in goes straight to Keston ID, and other clients (a
# bot, say) use the regular APIs, not this. Start the id stack first, then:
#
#   docker compose up -d --build

name: keston-admin

services:
  admin:
    build: .
    image: ghcr.io/thekestongroup/admin:latest
    restart: unless-stopped
    environment:
      # Every service behind the API, name=address. Add each new Keston app.
      KESTON_API_SERVICES: ${KESTON_API_SERVICES:-id=http://keston-id:8080}
      # Keston ID's public address, for signing in. Blank: worked out from the
      # address the app is on (admin.keston.localhost → id.keston.localhost).
      KESTON_ID_URL: ${KESTON_ID_URL:-}
    networks:
      keston:
        aliases: [admin]
    deploy:
      resources:
        limits: { memory: 64M }

networks:
  keston:
    name: keston
    external: true
